---
# PowerOps example for Kolla-Ansible/OpenStack 2025.1.
# All host names and addresses are documentation examples and must be reviewed.
workaround_ansible_issue_8743: true

kolla_base_distro: "rocky"
openstack_release: "2025.1"
kolla_container_engine: "podman"

kolla_internal_vip_address: "192.0.2.10"
network_interface: "eth0"
api_interface: "{{ network_interface }}"
tunnel_interface: "eth1.1020"
neutron_external_interface: "eth1.1030"

enable_haproxy: "yes"
enable_keepalived: "yes"
enable_mariadb: "yes"
enable_rabbitmq: "yes"
enable_keystone: "yes"
enable_nova: "yes"
enable_neutron: "yes"
enable_ironic: "yes"
enable_masakari: "yes"
enable_mistral: "yes"
enable_redis: "yes"
enable_powerops: "yes"

powerops_region_name: "RegionOne"
powerops_api_interface: "internal"
powerops_verify_tls: true
powerops_masakari_segment_name: "powerops-compute"
powerops_masakari_recovery_method: "auto"

powerops_base_images:
  mistral-api: "quay.io/openstack.kolla/rocky-source-mistral-api:2025.1"
  mistral-engine: "quay.io/openstack.kolla/rocky-source-mistral-engine:2025.1"
  mistral-executor: "quay.io/openstack.kolla/rocky-source-mistral-executor:2025.1"
  masakari-engine: "quay.io/openstack.kolla/rocky-source-masakari-engine:2025.1"
powerops_derived_images:
  mistral-api: "registry.example.invalid:5000/example/openstack/mistral-api-powerops:2025.1-v1"
  mistral-engine: "registry.example.invalid:5000/example/openstack/mistral-engine-powerops:2025.1-v1"
  mistral-executor: "registry.example.invalid:5000/example/openstack/mistral-executor-powerops:2025.1-v1"
  masakari-engine: "registry.example.invalid:5000/example/openstack/masakari-engine-powerops:2025.1-v1"
mistral_api_image_full: "{{ powerops_derived_images['mistral-api'] }}"
mistral_engine_image_full: "{{ powerops_derived_images['mistral-engine'] }}"
mistral_executor_image_full: "{{ powerops_derived_images['mistral-executor'] }}"
masakari_engine_image_full: "{{ powerops_derived_images['masakari-engine'] }}"

# Simplification approved for this example. Replace with Ansible Vault or an
# external secret manager before production use. Keep this file mode 0600.
powerops_bmc_secrets_in_globals: true
powerops_ironic_nodes:
  - name: "compute-01"
    nova_hostname: "compute-01"
    driver: "redfish"
    network_interface: "noop"
    desired_provision_state: "manageable"
    masakari_segment: "powerops-compute"
    masakari_reserved: false
    masakari_on_maintenance: true
    driver_info:
      redfish_address: "https://192.0.2.101"
      redfish_system_id: "/redfish/v1/Systems/1"
      redfish_username: "powerops"
      redfish_password: "example-only-redfish-password"
      redfish_verify_ca: false
    ports:
      - address: "02:00:00:00:01:01"
        physical_network: null

  - name: "compute-02"
    nova_hostname: "compute-02"
    driver: "ipmi"
    network_interface: "noop"
    desired_provision_state: "manageable"
    masakari_segment: "powerops-compute"
    masakari_reserved: false
    masakari_on_maintenance: true
    driver_info:
      ipmi_address: "192.0.2.102"
      ipmi_username: "powerops"
      ipmi_password: "example-only-ipmi-password"
    ports:
      - address: "02:00:00:00:02:01"
        physical_network: null
