[taskflow_driver_recovery_flows]
host_auto_failure_recovery_tasks = pre: [disable_compute_service_task, ironic_fence], main: [prepare_HA_enabled_instances_task], post: [evacuate_instances_task]
host_rh_failure_recovery_tasks = pre: [disable_compute_service_task, ironic_fence], main: [prepare_HA_enabled_instances_task], post: [evacuate_instances_task]

[powerops_ironic]
power_timeout = 180
poll_interval = 5
stable_off_observations = 3
